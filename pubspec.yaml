name: solar_management_system
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  #tap
  buttons_tabbar: ^1.3.15
  #svg image
  flutter_svg: ^2.2.0
  #pdf preview
  printing: ^5.14.2
  #create pdf
  pdf: ^3.11.3
  #create excel
  excel: ^4.0.6
  #path provider
  path_provider: ^2.1.5
  #datetime format
  intl: ^0.20.2
  #loading
  loader_overlay: ^5.0.0
  #tooltip_message
  el_tooltip: ^2.2.1
  #top snack bar - warning message
  top_snackbar_flutter: ^3.3.0
  share_plus: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Khmer
      fonts:
        - asset: assets/fonts/KantumruyPro_Regular.ttf
          weight: 800
        # - asset: assets/fonts/Khmer_Regular.ttf
        # - asset: assets/fonts/NotoSansKhmer_Regular.ttf

  assets:
    - assets/images/
